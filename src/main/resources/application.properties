spring.application.name=shipit-backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shipit}
spring.datasource.username=${DB_USERNAME:shipit_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info
spring.jpa.open-in-view=false

# ShipIt Application Configuration
shipit.app.name=ShipIt
shipit.app.base-url=${APP_BASE_URL:http://localhost:8080}
shipit.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# JWT Configuration
shipit.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
shipit.jwt.access-token-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:900}
shipit.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}

# Security Token Configuration
shipit.auth.email-verification-expiration-seconds=${EMAIL_VERIFICATION_EXPIRATION_SECONDS:86400}
shipit.auth.password-reset-expiration-seconds=${PASSWORD_RESET_EXPIRATION_SECONDS:3600}

# GitHub OAuth Configuration (Authentication only)
shipit.oauth.github.client-id=${GITHUB_OAUTH_CLIENT_ID:}
shipit.oauth.github.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
shipit.oauth.github.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:http://localhost:5173/auth/callback/github}




