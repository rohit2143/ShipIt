spring.application.name=shipit-backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shipit}
spring.datasource.username=${DB_USERNAME:shipit_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info
spring.jpa.open-in-view=false

# ShipIt Application Configuration
shipit.app.name=ShipIt
shipit.app.base-url=${APP_BASE_URL:http://localhost:8080}
shipit.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# JWT Configuration
shipit.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
shipit.jwt.access-token-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:900}
shipit.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}

# Security Token Configuration
shipit.auth.email-verification-expiration-seconds=${EMAIL_VERIFICATION_EXPIRATION_SECONDS:86400}
shipit.auth.password-reset-expiration-seconds=${PASSWORD_RESET_EXPIRATION_SECONDS:3600}

# GitHub OAuth Configuration (Authentication only)
shipit.oauth.github.client-id=${GITHUB_OAUTH_CLIENT_ID:}
shipit.oauth.github.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
shipit.oauth.github.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:http://localhost:5173/auth/callback/github}

# GitHub App Configuration (Module 2 - Repository Access)
shipit.github.app.app-name=${GITHUB_APP_NAME:shipit-dev-rohit}
shipit.github.app.app-id=${GITHUB_APP_ID:5773424}
shipit.github.app.client-id=${GITHUB_APP_CLIENT_ID:Iv23listffPsMl4Knri}
shipit.github.app.client-secret=${GITHUB_APP_CLIENT_SECRET:}
shipit.github.app.redirect-uri=${GITHUB_APP_REDIRECT_URI:http://localhost:5173/github/callback}
shipit.github.app.state-expiration-seconds=${GITHUB_APP_STATE_EXPIRATION_SECONDS:900}
shipit.github.app.private-key=${GITHUB_APP_PRIVATE_KEY:}
shipit.github.app.private-key-path=${GITHUB_APP_PRIVATE_KEY_PATH:secrets/github-app-private-key.pem}
shipit.github.app.token-buffer-seconds=${GITHUB_APP_TOKEN_BUFFER_SECONDS:300}
shipit.github.app.webhook-secret=${GITHUB_APP_WEBHOOK_SECRET:}

# Encryption Configuration (Module 3 - Environment Variable Secrets at rest)
shipit.encryption.secret-key=${SHIPIT_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

# Background Job Worker Configuration (Module 5)
shipit.worker.enabled=${WORKER_ENABLED:true}
shipit.worker.worker-id=${WORKER_ID:}
shipit.worker.poll-interval-ms=${WORKER_POLL_INTERVAL_MS:2000}
shipit.worker.heartbeat-interval-ms=${WORKER_HEARTBEAT_INTERVAL_MS:10000}
shipit.worker.stale-threshold-seconds=${WORKER_STALE_THRESHOLD_SECONDS:180}
shipit.worker.recovery-interval-ms=${WORKER_RECOVERY_INTERVAL_MS:60000}

# Build Engine Configuration (Module 6)
shipit.build.workspace-base-dir=${BUILD_WORKSPACE_BASE_DIR:/tmp/shipit-builds}
shipit.build.timeout-seconds=${BUILD_TIMEOUT_SECONDS:600}
shipit.build.max-log-lines=${BUILD_MAX_LOG_LINES:5000}
shipit.build.max-line-length=${BUILD_MAX_LINE_LENGTH:1024}
shipit.build.default-jdk-image=${BUILD_DEFAULT_JDK_IMAGE:eclipse-temurin:21-jdk-alpine}
shipit.build.default-jre-image=${BUILD_DEFAULT_JRE_IMAGE:eclipse-temurin:21-jre-alpine}

# Container Deployment Engine Configuration (Module 7)
shipit.container.min-port=${CONTAINER_MIN_PORT:10000}
shipit.container.max-port=${CONTAINER_MAX_PORT:20000}
shipit.container.memory-limit=${CONTAINER_MEMORY_LIMIT:512m}
shipit.container.cpu-limit=${CONTAINER_CPU_LIMIT:0.5}
shipit.container.health-check-timeout-seconds=${CONTAINER_HEALTH_CHECK_TIMEOUT_SECONDS:60}
shipit.container.health-check-interval-seconds=${CONTAINER_HEALTH_CHECK_INTERVAL_SECONDS:2}
shipit.container.health-check-path=${CONTAINER_HEALTH_CHECK_PATH:/}
shipit.container.stop-timeout-seconds=${CONTAINER_STOP_TIMEOUT_SECONDS:10}
shipit.container.restart-policy=${CONTAINER_RESTART_POLICY:unless-stopped}



